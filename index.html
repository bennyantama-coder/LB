<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jasa Medis dr. Benny</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jasa dr. Benny">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --bg: #f3f5f9;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 110px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--primary), #3b82f6);
            color: white;
            padding: 22px 18px 18px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
        }

        header .title {
            font-size: 1.15rem;
            letter-spacing: 0.01em;
            margin-bottom: 6px;
        }

        header .subtitle {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.85);
            line-height: 1.5;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 18px 18px 0;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 34px rgba(15, 23, 42, 0.05);
        }

        .card h3,
        .card h4 {
            margin: 0 0 14px;
            font-weight: 700;
            color: #111827;
        }

        .card h4 {
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #374151;
        }

        input,
        select,
        button {
            width: 100%;
            border-radius: 14px;
            font-size: 1rem;
        }

        input,
        select {
            padding: 14px 16px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary,
        button[type="submit"] {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .btn-secondary,
        button.secondary {
            background: #10b981;
            color: white;
            font-weight: 700;
        }

        .btn-danger,
        button.danger {
            background: var(--danger);
            color: white;
            font-weight: 700;
        }

        .nav-bar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            border-top: 1px solid rgba(229, 231, 235, 0.95);
            box-shadow: 0 -12px 30px rgba(15, 23, 42, 0.08);
        }

        .nav-item {
            padding: 14px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b7280;
            text-align: center;
            cursor: pointer;
            background: white;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--primary-soft);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.95rem;
            margin-top: 12px;
        }

        thead {
            background: #f8fafc;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td small,
        td i {
            color: var(--muted);
            font-size: 0.88rem;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        ul#listTindakan li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            margin-bottom: 10px;
            background: #f9fafb;
        }

        ul#listTindakan li button {
            width: auto;
            padding: 8px 12px;
            font-size: 0.85rem;
            box-shadow: none;
        }

        @media (min-width: 720px) {
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .container {
                padding: 22px 22px 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="title">dr. Benny Antama Syant, Sp.JP</div>
        <div class="subtitle">Catatan jasa medis dan rekap pasien lengkap dalam satu aplikasi.</div>
    </header>

    <div class="container">
        <!-- HALAMAN INPUT -->
        <div id="page-input" class="page active">
            <div class="card">
                <h3>Input Tindakan Baru</h3>
                <form id="recordForm">
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="tanggal" required>
                    </div>
                    <div class="form-group">
                        <label>Rumah Sakit</label>
                        <select id="rs" required>
                            <option value="RSUD dr. Adnaan WD Payakumbuh">RSUD dr. Adnaan WD Payakumbuh</option>
                            <option value="RSI Ibnu Sina Payakumbuh">RSI Ibnu Sina Payakumbuh</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ruang Tindakan</label>
                        <input type="text" id="ruangan" placeholder="Contoh: Poli Jantung / ICU / Cathlab" required>
                    </div>
                    <div class="form-group">
                        <label>No MR</label>
                        <input type="text" id="noMr" list="mrList" placeholder="Masukkan No MR" required>
                        <datalist id="mrList"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Nama Pasien</label>
                        <input type="text" id="namaPasien" placeholder="Nama Pasien" required>
                    </div>
                    <div class="form-group">
                        <label>Tindakan</label>
                        <select id="tindakanSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Jasa Bersih (Rp)</label>
                        <input type="number" id="jasaBersih" placeholder="0" required>
                    </div>
                    <button type="submit" class="btn-primary">Simpan Data</button>
                </form>
            </div>
        </div>

        <!-- HALAMAN REKAP -->
        <div id="page-rekap" class="page">
            <div class="card">
                <h3>Rekap Data</h3>
                <button type="button" class="btn-secondary" onclick="exportCSV()">Unduh Rekap (CSV)</button>
                <div style="overflow-x: auto;">
                    <table id="rekapTable">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>RS & Ruang</th>
                                <th>Pasien (MR)</th>
                                <th>Tindakan</th>
                                <th>Jasa</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- HALAMAN PENGATURAN -->
        <div id="page-setting" class="page">
            <div class="card">
                <h3>Kelola Tindakan & Tarif</h3>
                <div class="form-group">
                    <label>Nama Tindakan</label>
                    <input type="text" id="newTindakan" placeholder="Contoh: Ekokardiografi">
                </div>
                <div class="form-group">
                    <label>Tarif Jasa Bersih (Default)</label>
                    <input type="number" id="newTarif" placeholder="Contoh: 150000">
                </div>
                <button type="button" class="btn-primary" onclick="tambahTindakan()">Tambah/Update Tindakan</button>
                
                <h4 style="margin-top: 20px;">Daftar Tindakan</h4>
                <ul id="listTindakan" style="padding-left: 20px;"></ul>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('input', this)">Input</div>
        <div class="nav-item" onclick="switchPage('rekap', this)">Rekap</div>
        <div class="nav-item" onclick="switchPage('setting', this)">Pengaturan</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
